name: React build

on: 
  push:
    branches:
     - main

jobs:

  build:
    runs-on: ubuntu-latest

    env: 
      VITE_API_URL: ${{secrets.VITE_API_URL}}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install

      - name: Print variable
        run: echo $VITE_API_URL

      - run: npm run build


